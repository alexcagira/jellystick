# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Jellystick version (Settings → About and the APK name). Raise it before publishing a new APK:
# 13.2.0 → 13.2.1 → 13.3.0...
jellystick.version=13.2.0

# Settings → Update Jellystick installs the APK of the latest release of this GitHub repository.
# The release tag is its version ("v13.3.0") and it must be higher than jellystick.version above
jellystick.updateRepo=alexcagira/jellystick
