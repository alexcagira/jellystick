# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default

# Jellystick version (Settings → About, the APK name and the server dashboard). It is the version of
# the GitHub release: raise it before publishing a new APK and tag the release with it, "v1.2.3"
# for 1.2.3 (1.2.2 → 1.2.3 → 1.3.0...)
jellystick.version=1.2.8

# Settings → Update Jellystick installs the APK of the latest release of this GitHub repository.
# The release tag is its version ("v1.2.3") and it must be higher than jellystick.version above
jellystick.updateRepo=alexcagira/jellystick
